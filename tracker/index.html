<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Plate Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>License Plate Scanner</h1>

    <!-- Video Feed from Camera -->
    <video id="video" autoplay></video>

    <!-- Capture Image Button -->
    <button onclick="captureImage()">Capture Image</button>

    <!-- Canvas to Store Captured Image -->
    <canvas id="canvas" style="display: none;"></canvas>

    <h3>Extracted Plate Number:</h3>
    <p id="outputText"></p>
    <h3>Owner Details</h3>
    <input type="text" id="ownerName" placeholder="Owner Name">
    <input type="text" id="carModel" placeholder="Car Model">
    <button onclick="saveData()">Save Details</button>

    <h3>Stored Plates:</h3>
    <ul id="plateList"></ul>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js"></script>

    <script src="script.js"></script>
</body>

</html>
